<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TTD — Dynamic Form Replacement Test</title>
  <style>
    body { font-family: sans-serif; background: #faf7f2; padding: 24px; color: #333; }
    .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 16px; max-width: 600px; }
    .row { margin-bottom: 12px; }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { padding: 8px 16px; background: #54258a; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card" id="dynamic-form-root">
    <h1>Special Entry Darshan (₹300)</h1>
    <p>Dynamic DOM Replacement & Mutation Fixture</p>

    <div id="form-container">
      <div class="row">
        <label for="name_0">Pilgrim Name</label>
        <input type="text" id="name_0" name="pilgrimName_0" value="" />
      </div>
      <div class="row">
        <label for="age_0">Pilgrim Age</label>
        <input type="number" id="age_0" name="pilgrimAge_0" value="" />
      </div>
      <div class="row">
        <label for="idNumber_0">Aadhaar Number</label>
        <input type="text" id="idNumber_0" name="pilgrimIdNumber_0" value="" />
      </div>
    </div>

    <button type="button" id="replace-dom-btn" onclick="replaceForm()">Simulate Framework Re-render</button>
  </div>

  <script>
    function replaceForm() {
      const container = document.getElementById('form-container');
      container.innerHTML = `
        <div class="row">
          <label for="name_0_new">Pilgrim Name (Replaced DOM Node)</label>
          <input type="text" id="name_0" name="pilgrimName_0" value="" data-re-rendered="true" />
        </div>
        <div class="row">
          <label for="age_0_new">Pilgrim Age (Replaced DOM Node)</label>
          <input type="number" id="age_0" name="pilgrimAge_0" value="" data-re-rendered="true" />
        </div>
        <div class="row">
          <label for="idNumber_0_new">Aadhaar Number (Replaced DOM Node)</label>
          <input type="text" id="idNumber_0" name="pilgrimIdNumber_0" value="" data-re-rendered="true" />
        </div>
      `;
    }
  </script>
</body>
</html>
