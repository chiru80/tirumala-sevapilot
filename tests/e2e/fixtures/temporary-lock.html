<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TTD — Booking Notification</title>
  <style>
    body { font-family: sans-serif; background: #faf7f2; padding: 24px; color: #333; }
    .alert-box { background: #fff3e0; border: 2px solid #ff9800; border-radius: 8px; padding: 20px; max-width: 600px; color: #e65100; font-weight: bold; }
  </style>
</head>
<body>
  <div class="alert-box" id="ttd-lock-notice">
    <h2>Notice: Active Transaction in Progress</h2>
    <p>Booking with same pilgrim id is in progress. Your previous attempt is still holding these pilgrims. TTD holds slot tokens for several minutes before releasing. Please wait or check your booking history before retrying.</p>
  </div>
</body>
</html>
