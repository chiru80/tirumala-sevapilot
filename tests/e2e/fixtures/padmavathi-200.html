<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TTD — Padmavathi Supadham Entry (₹200)</title>
  <style>
    body { font-family: sans-serif; background: #faf7f2; padding: 24px; color: #333; }
    .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; max-width: 700px; }
    h1, h2 { color: #54258a; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; }
    .field { flex: 1; display: flex; flex-direction: column; }
    label { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .boundary-section { background: #fff8e1; border: 1px solid #ffe082; padding: 12px; border-radius: 6px; margin-top: 16px; }
    .btn { background: #54258a; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card" id="ttd-spat-container">
    <h1>Padmavathi / Sri PAT</h1>
    <p>Sri Padmavathi Ammavari Temple, Tiruchanoor — Supadham Entry (₹200)</p>

    <!-- Pilgrim Details ONLY (Padmavathi has NO General Details step) -->
    <h2>Pilgrim Details</h2>
    <div id="pilgrim-card-0" class="pilgrim-card" data-pilgrim-index="0">
      <h3>Pilgrim 1</h3>
      <div class="row">
        <div class="field">
          <label for="name_0">Full Name *</label>
          <input type="text" id="name_0" name="pilgrimName_0" placeholder="Enter full name" />
        </div>
        <div class="field">
          <label for="age_0">Age *</label>
          <input type="number" id="age_0" name="pilgrimAge_0" placeholder="Age" min="1" max="120" />
        </div>
        <div class="field">
          <label for="gender_0">Gender *</label>
          <select id="gender_0" name="pilgrimGender_0">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="idType_0">Photo ID Type *</label>
          <select id="idType_0" name="pilgrimIdType_0">
            <option value="">Select ID Proof</option>
            <option value="Aadhaar">Aadhaar</option>
            <option value="Passport">Passport</option>
            <option value="Voter ID">Voter ID</option>
          </select>
        </div>
        <div class="field">
          <label for="idNumber_0">Photo ID Number *</label>
          <input type="text" id="idNumber_0" name="pilgrimIdNumber_0" placeholder="Enter ID number" />
        </div>
      </div>
    </div>

    <!-- Human Security & Financial Boundaries -->
    <div class="boundary-section">
      <h3>Manual Devotee Steps</h3>
      <div class="row">
        <div class="field">
          <label for="captcha">Enter CAPTCHA *</label>
          <input type="text" id="captcha" name="captcha" placeholder="Solve CAPTCHA manually" />
        </div>
      </div>
      <button type="button" class="btn" id="submit-spat-btn">Continue (₹200)</button>
    </div>
  </div>
</body>
</html>
