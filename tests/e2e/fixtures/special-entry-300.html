<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TTD — Special Entry Darshan (₹300) Booking</title>
  <style>
    body { font-family: sans-serif; background: #faf7f2; padding: 24px; color: #333; }
    .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; max-width: 700px; }
    h1, h2 { color: #54258a; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; }
    .field { flex: 1; display: flex; flex-direction: column; }
    label { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .boundary-section { background: #fff8e1; border: 1px solid #ffe082; padding: 12px; border-radius: 6px; margin-top: 16px; }
    .btn { background: #54258a; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card" id="ttd-sed-container">
    <h1>Special Entry Darshan (₹300)</h1>
    <p>Sri Venkateswara Swamy Temple, Tirumala — Seeghra Darshanam</p>

    <!-- Step 1: Pilgrim Details -->
    <h2>Step 1: Pilgrim Details</h2>
    <div id="pilgrim-card-0" class="pilgrim-card" data-pilgrim-index="0">
      <h3>Pilgrim 1</h3>
      <div class="row">
        <div class="field">
          <label for="name_0">Full Name *</label>
          <input type="text" id="name_0" name="pilgrimName_0" placeholder="Enter full name" />
        </div>
        <div class="field">
          <label for="age_0">Age *</label>
          <input type="number" id="age_0" name="pilgrimAge_0" placeholder="Age" min="1" max="120" />
        </div>
        <div class="field">
          <label for="gender_0">Gender *</label>
          <select id="gender_0" name="pilgrimGender_0">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="idType_0">Photo ID Type *</label>
          <select id="idType_0" name="pilgrimIdType_0">
            <option value="">Select ID Proof</option>
            <option value="Aadhaar">Aadhaar</option>
            <option value="Passport">Passport</option>
            <option value="Voter ID">Voter ID</option>
            <option value="PAN">PAN</option>
          </select>
        </div>
        <div class="field">
          <label for="idNumber_0">Photo ID Number *</label>
          <input type="text" id="idNumber_0" name="pilgrimIdNumber_0" placeholder="Enter ID number" />
        </div>
      </div>
    </div>

    <!-- Step 2: General Contact Details -->
    <h2>Step 2: General Details</h2>
    <div id="general-details-section">
      <div class="row">
        <div class="field">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" placeholder="devotee@example.com" />
        </div>
        <div class="field">
          <label for="mobile">Mobile Number</label>
          <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="city">City / Town *</label>
          <input type="text" id="city" name="city" placeholder="City" />
        </div>
        <div class="field">
          <label for="state">State *</label>
          <input type="text" id="state" name="state" placeholder="State" />
        </div>
        <div class="field">
          <label for="pincode">Pincode *</label>
          <input type="text" id="pincode" name="pincode" placeholder="6-digit PIN" maxlength="6" />
        </div>
      </div>
    </div>

    <!-- Human Security & Financial Boundaries -->
    <div class="boundary-section">
      <h3>Manual Devotee Steps (Zero Automation Boundaries)</h3>
      <div class="row">
        <div class="field">
          <label for="captcha">Enter CAPTCHA *</label>
          <input type="text" id="captcha" name="captcha" placeholder="Solve CAPTCHA manually" />
        </div>
      </div>
      <div class="row">
        <label>
          <input type="checkbox" id="declaration" name="declaration" />
          I hereby declare that the details provided are true and correct.
        </label>
      </div>
      <button type="button" class="btn" id="submit-booking-btn">Continue to Payment (₹300)</button>
    </div>
  </div>
</body>
</html>
