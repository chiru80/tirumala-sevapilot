<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sri Srinivasa Divyanugraha Homam - General Details</title>
</head>
<body>
  <div class="homam-general-details">
    <h1>Sri Srinivasa Divyanugraha Homam</h1>
    <h2>General Details</h2>
    <form id="homamGeneralForm">
      <div class="field-group">
        <label for="gothram">Gothram *</label>
        <input type="text" id="gothram" name="gothram" required placeholder="Gothram">
      </div>
      <div class="field-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required placeholder="devotee@example.com">
      </div>
      <div class="field-group">
        <label for="city">City *</label>
        <input type="text" id="city" name="city" required placeholder="City">
      </div>
      <div class="field-group">
        <label for="state">State *</label>
        <input type="text" id="state" name="state" required placeholder="State">
      </div>
      <div class="field-group">
        <label for="country">Country *</label>
        <input type="text" id="country" name="country" required value="India">
      </div>
      <div class="field-group">
        <label for="pinCode">Pincode *</label>
        <input type="text" id="pinCode" name="pinCode" required placeholder="Pincode">
      </div>
      <button type="button" id="btnContinueGeneral">Proceed to Pilgrim Details</button>
    </form>
  </div>
</body>
</html>
