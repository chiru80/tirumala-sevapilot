<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sri Padmavathi Ammavari Special Entry - Pilgrim Details</title>
</head>
<body>
  <div class="ammavari-pilgrim-page">
    <h1>Sri Padmavathi Ammavari Supadham Entry ₹200</h1>
    <h2>Pilgrim Details</h2>
    <form id="padmavathiForm">
      <div class="devotee-row" data-index="0">
        <label>Devotee Name</label>
        <input type="text" name="devoteeName_0" placeholder="Full Name">
        <label>Age</label>
        <input type="number" name="devoteeAge_0" placeholder="Age">
        <label>Gender</label>
        <select name="devoteeGender_0">
          <option value="Female">Female</option>
          <option value="Male">Male</option>
        </select>
        <label>Photo ID Proof</label>
        <select name="idProof_0">
          <option value="Aadhaar">Aadhaar</option>
        </select>
        <label>Photo ID Number</label>
        <input type="text" name="idNumber_0" placeholder="ID Number">
      </div>
      <!-- Directly transitions to Review - NO General Details form -->
      <button type="button" id="btnContinueReview">Review Details</button>
    </form>
  </div>
</body>
</html>
