<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special Entry Darshan - Pilgrim Details</title>
</head>
<body>
  <div class="pilgrim-details-page">
    <h1>Special Entry Darshan (Sri PAT)</h1>
    <h2>Pilgrim Details</h2>
    <form id="pilgrimForm">
      <div class="pilgrim-row" data-pilgrim-index="0">
        <label>Name</label>
        <input type="text" name="pilgrimName_0" placeholder="Devotee Full Name">
        <label>Age</label>
        <input type="number" name="pilgrimAge_0" placeholder="Age">
        <label>Gender</label>
        <select name="pilgrimGender_0">
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
        <label>Photo ID Proof</label>
        <select name="idProofType_0">
          <option value="">Select ID Proof</option>
          <option value="Aadhaar">Aadhaar</option>
          <option value="Passport">Passport</option>
        </select>
        <label>Photo ID Number</label>
        <input type="text" name="idNumber_0" placeholder="ID Number">
      </div>
      <button type="button" id="btnContinuePilgrims">Continue</button>
    </form>
  </div>
</body>
</html>
