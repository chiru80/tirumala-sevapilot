<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special Entry Darshan (₹300) - Slot Selection</title>
</head>
<body>
  <div class="booking-container">
    <h1>Special Entry Darshan (Sri PAT)</h1>
    <h2>Slot Selection</h2>
    <div class="calendar-matrix">
      <div class="slot-card available active" data-time="10:00" data-quota="120">
        <span class="slot-time">10:00 AM</span>
        <span class="slot-status">Available</span>
      </div>
      <div class="slot-card disabled" data-time="11:00" data-quota="0">
        <span class="slot-time">11:00 AM</span>
        <span class="slot-status">Full</span>
      </div>
    </div>
    <button type="button" id="btnContinueSlot" class="mat-button">Continue</button>
  </div>
</body>
</html>
