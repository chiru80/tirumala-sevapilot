<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special Entry Darshan - General Details</title>
</head>
<body>
  <div class="general-details-page">
    <h2>General Details</h2>
    <form id="generalDetailsForm">
      <label>Email</label>
      <input type="email" name="email" id="email" placeholder="devotee@example.com">
      <label>Mobile (Optional)</label>
      <input type="tel" name="mobile" id="mobile" placeholder="Mobile Number">
      <label>City</label>
      <input type="text" name="city" id="city" placeholder="City">
      <label>State</label>
      <input type="text" name="state" id="state" placeholder="State">
      <label>Country</label>
      <input type="text" name="country" id="country" value="India">
      <label>Pincode</label>
      <input type="text" name="pinCode" id="pinCode" placeholder="Pincode">
      <button type="button" id="btnContinueGeneral">Continue</button>
    </form>
  </div>
</body>
</html>
