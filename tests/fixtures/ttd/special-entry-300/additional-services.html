<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special Entry Darshan - Additional Services</title>
</head>
<body>
  <div class="additional-services-page">
    <h2>Additional Services</h2>
    <div class="service-opt">
      <label for="extraLaddus">Number of Additional Laddus (₹50 each)</label>
      <input type="number" id="extraLaddus" name="additionalLaddus" min="0" max="2" value="1">
    </div>
    <div class="service-opt">
      <label for="hundiOffering">Hundi Offerings (₹)</label>
      <input type="number" id="hundiOffering" name="hundiOffering" min="0" value="0">
    </div>
    <button type="button" id="btnContinueServices">Continue</button>
  </div>
</body>
</html>
