<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TTD Payment Gateway</title>
</head>
<body>
  <div class="pg-container" id="paymentForm">
    <h2>Select Payment Option</h2>
    <div class="payment-methods">
      <label><input type="radio" name="paymentMode" value="UPI"> UPI</label>
      <label><input type="radio" name="paymentMode" value="NET_BANKING"> Net Banking</label>
      <label><input type="radio" name="paymentMode" value="CARD"> Credit / Debit Card</label>
    </div>
    <button type="submit" id="btnPayNow">Pay Now</button>
  </div>
</body>
</html>
