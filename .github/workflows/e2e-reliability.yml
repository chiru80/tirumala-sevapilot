name: Browser E2E & Reliability Lab

on:
  push:
    branches: [ master, main, 'phase-*' ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability-lab:
    name: Build, Unit Tests & Browser E2E Lab
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Vitest Unit Test Suite
        run: npm test

      - name: Build Extension (Manifest V3 Production Build)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Execute Browser E2E Test Suite
        run: npx playwright test
        env:
          CI: true

      - name: Upload Test Artifacts (Screenshots, Traces & HTML Report)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14
